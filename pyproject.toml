[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-router"
version = "0.0.0"
description = "Governed baseline runtime scaffold for IcebergRouter"
readme = "iceberg/README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["iceberg_router*"]
exclude = ["tests*"]
